name: SHLoreValue
version: '${project.version}'
main: org.Cry_Legende.sHLoreValue.SHLoreValue
api-version: '1.20'
author: Cry_Legende
depend: [ProtocolLib]

commands:
  shlorevalue:
    description: Administration de SHLoreValue (rechargement des valeurs de blocs).
    usage: /<command> reload

permissions:
  shlorevalue.admin:
    description: Toutes les sous-commandes d'administration de /shlorevalue.
    default: op
    children:
      shlorevalue.admin.reload: true
  shlorevalue.admin.reload:
    description: Recharger config.yml, messages.yml et les valeurs de SuperiorSkyblock2 (/shlorevalue reload).
    default: op
